<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Modern web calculator with keyboard support, history and saved state.">
  <title>Web Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1 class="grad">✨ Web Calculator</h1>
    <button id="theme" class="icon" aria-label="Toggle theme"></button>
  </header>

  <main>
    <section class="card calc" aria-label="Calculator">
      <div class="display" id="display" title="Click to copy" aria-live="polite">
        <small id="expr">&nbsp;</small>
        <output id="num" class="grad">0</output>
      </div>
      <div class="keys" id="keys"></div>
    </section>

    <aside class="card history" aria-label="History">
      <div class="head"><h2 class="grad">🕘 History</h2><button id="clear" class="ghost">Clear</button></div>
      <ul id="list"></ul>
    </aside>
  </main>

  <div id="toast" role="status"></div>
</body>
</html>
